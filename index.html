<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maeve 2">
<title>Maeve 两岁啦</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0a0f24;
    --bg2: #1d2752;
    --pink: #f4b3c2;
    --yellow: #f3d7a1;
    --mint: #fbf1e4;
    --white: #fbf1e4;
    --glow-gold: rgba(243,215,161,.45);
    --glow-pink: rgba(244,179,194,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, var(--bg2), var(--bg1) 70%);
    color: var(--white);
    font-family: "Baloo 2", "ZCOOL KuaiLe", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px; pointer-events: none;
  }
  .stage > * { pointer-events: auto; }
  .hidden { display: none !important; }

  /* Start screen */
  #start h1 { font-size: clamp(28px, 6vw, 56px); line-height: 1.2; }
  #start h1 .zh { font-family: "ZCOOL KuaiLe", sans-serif; display: block; }
  #startBtn {
    margin-top: 32px; padding: 18px 40px; border: 0; border-radius: 999px;
    font: 800 clamp(20px, 4vw, 30px) "Baloo 2", "ZCOOL KuaiLe", sans-serif;
    background: transparent; color: var(--yellow); cursor: pointer;
    border: 2px solid var(--yellow);
    box-shadow: 0 0 30px var(--glow-gold), inset 0 0 20px rgba(243,215,161,.15);
    animation: bob 1.6s ease-in-out infinite;
  }
  #startBtn:active { transform: scale(.96); }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  /* Countdown */
  #num {
    font-size: min(55vw, 55vh); font-weight: 800; line-height: 1;
    color: var(--yellow);
    text-shadow: 0 0 60px var(--glow-gold);
  }
  .pop { animation: pop .9s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop {
    0% { transform: scale(.2); opacity: 0; }
    40% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Celebration text */
  .msg { animation: pop 1.1s cubic-bezier(.2,1.6,.4,1) both; }
  .msg .zh { font-family: "ZCOOL KuaiLe", sans-serif; display: block; }
  .msg .en { display: block; }
  #two .zh { font-size: clamp(48px, 12vw, 130px); color: var(--yellow); }
  #two .en { font-size: clamp(36px, 8vw, 90px); color: var(--mint); }
  #big2 {
    font-size: min(45vw, 45vh); font-weight: 800; line-height: .9;
    color: var(--yellow); text-shadow: 0 0 60px var(--glow-gold);
    display: inline-block; position: relative; margin-top: .2em;
  }
  #big2.is2 { color: var(--pink); text-shadow: 0 0 60px var(--glow-pink); }
  .flame {
    position: absolute; left: 50%; top: -.22em; width: .13em; height: .24em;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 75%, #fff 0, #ffe98a 30%, #ff9f5a 65%, transparent 72%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    filter: drop-shadow(0 0 .08em #ffb347);
    animation: flicker .18s ease-in-out infinite alternate;
  }
  @keyframes flicker { to { transform: translateX(-50%) scale(.92, 1.08) rotate(3deg); } }
  #big2.flip { animation: flip 1s ease-in-out; }
  @keyframes flip { 50% { transform: rotateY(90deg) scale(1.15); } }
  #mute {
    position: fixed; right: 16px; top: 16px; z-index: 5;
    padding: 10px 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.4);
    background: rgba(0,0,0,.25); color: var(--white); cursor: pointer;
    font: 600 16px "Baloo 2", "ZCOOL KuaiLe", sans-serif;
  }
  #hb .zh { font-size: min(9vw, 6.5vh); color: var(--yellow); line-height: 1.2; }
  #hb .en { font-size: min(6vw, 4.5vh); color: var(--mint); line-height: 1.2; }
  .photo {
    display: block; height: min(46vh, 95vw); aspect-ratio: 3 / 4; margin: 0 auto 2vh;
    object-fit: cover; border-radius: 24px;
    border: 4px solid var(--yellow);
    box-shadow: 0 0 40px var(--glow-gold), 0 0 90px var(--glow-pink);
    animation: photoIn 1.4s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes photoIn { from { transform: scale(.3) rotate(-12deg); opacity: 0; } to { transform: rotate(-2deg); opacity: 1; } }
  #hb .name {
    font-size: min(15vw, 11vh); font-weight: 800; color: var(--pink);
    text-shadow: 0 0 50px var(--glow-pink);
    display: block; line-height: 1.1;
    animation: wiggle 2.2s ease-in-out infinite;
  }
  @keyframes wiggle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.05); } }

  #replay {
    position: fixed; right: 16px; bottom: 16px; z-index: 5;
    padding: 10px 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,.4);
    background: rgba(0,0,0,.25); color: var(--white); cursor: pointer;
    font: 600 16px "Baloo 2", "ZCOOL KuaiLe", sans-serif;
  }

  /* Balloons */
  .balloon {
    position: fixed; bottom: -160px; width: 70px; height: 88px; border-radius: 50% 50% 48% 48%;
    animation: rise linear forwards; cursor: pointer; z-index: 3;
  }
  .balloon::after {
    content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 70px;
    background: rgba(255,255,255,.5);
  }
  .balloon::before {
    content: ""; position: absolute; left: 22%; top: 16%; width: 16px; height: 24px;
    border-radius: 50%; background: rgba(255,255,255,.35); transform: rotate(25deg);
  }
  @keyframes rise { to { transform: translateY(calc(-100vh - 260px)) translateX(var(--drift)); } }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<section class="stage" id="start">
  <h1><span class="zh">今天是谁的大日子？</span>Whose big day is it today?</h1>
  <button id="startBtn">开始 · Start ▶</button>
</section>

<section class="stage hidden" id="countdown">
  <div id="num">10</div>
</section>

<section class="stage hidden" id="two">
  <span id="big2"><span id="digit">1</span><span class="flame"></span></span>
  <div id="twoWords">
    <span class="zh">我两岁了！</span>
    <span class="en">I'm two!</span>
  </div>
</section>

<section class="stage hidden" id="hb">
  <img class="photo" src="maeve.jpg" alt="Maeve">
  <div class="msg">
    <span class="zh">生日快乐</span>
    <span class="name">Maeve</span>
    <span class="en">Happy Birthday!</span>
  </div>
</section>

<button id="mute">🔇 静音 · Muted</button>
<button id="replay" class="hidden">↻ 再来一次 · Again</button>

<script>
const NAME = "Maeve";
const COLORS = ["#f4b3c2","#f3d7a1","#bcd3f5","#ffd2b8","#d8c8f0","#fbf1e4","#ffffff"];

const $ = id => document.getElementById(id);
const show = id => { ["start","countdown","two","hb"].forEach(s => $(s).classList.toggle("hidden", s !== id)); };

/* ---------- Audio (generated, no files needed) ---------- */
let ac, muted = true; // muted by default so a sleeping baby isn't woken
function audio() {
  if (!ac) {
    // iPad/iPhone: play even when the device is in silent mode (Safari 16.4+)
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    ac = new (window.AudioContext || window.webkitAudioContext)();
  }
  return ac;
}
function tone(freq, start, dur, type = "triangle", vol = 0.18) {
  if (muted) return;
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, start + dur);
  o.connect(g).connect(a.destination); o.start(start); o.stop(start + dur + 0.05);
}
function beep(n) { const t = audio().currentTime; tone(n === 0 ? 880 : 520 + (10 - n) * 25, t, 0.25, "sine", 0.25); }
function boom() {
  if (muted) return;
  const a = audio(), len = a.sampleRate * 0.6, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = "lowpass"; f.frequency.value = 600 + Math.random() * 900; g.gain.value = 0.35;
  src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
}
let songPlaying = false;
function playSong() {
  if (songPlaying) return; songPlaying = true;
  const N = { G4:392, A4:440, B4:494, C5:523, D5:587, E5:659, F5:698, G5:784 };
  const melody = [
    ["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],
    ["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],
    ["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",2],
    ["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",3]
  ];
  const beat = 0.42; let t = audio().currentTime + 0.1;
  for (const [n, d] of melody) { tone(N[n], t, d * beat * 0.95, "triangle", 0.16); tone(N[n] / 2, t, d * beat * 0.95, "sine", 0.06); t += d * beat; }
  setTimeout(() => songPlaying = false, (t - audio().currentTime) * 1000);
}

/* ---------- Fireworks + confetti ---------- */
const cv = $("sky"), ctx = cv.getContext("2d");
let W, H, parts = [], rockets = [], confetti = [], stars = [];
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: 120 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5, p: Math.random() * 6 }));
}
addEventListener("resize", resize); resize();

function launch(x = W * (0.15 + Math.random() * 0.7), ty = H * (0.12 + Math.random() * 0.35)) {
  rockets.push({ x, y: H, ty, vy: -(H - ty) / 45, color: COLORS[Math.random() * COLORS.length | 0] });
}
function explode(x, y, color) {
  boom();
  const n = 70 + Math.random() * 40, heart = Math.random() < 0.25;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    let vx, vy;
    if (heart) { // heart-shaped burst
      vx = 16 * Math.pow(Math.sin(a), 3) / 4;
      vy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 4;
    } else { const s = 2 + Math.random() * 4; vx = Math.cos(a) * s; vy = Math.sin(a) * s; }
    parts.push({ x, y, vx, vy, life: 1, color: Math.random() < 0.2 ? "#fff" : color });
  }
}
function confettiBurst(count = 160) {
  for (let i = 0; i < count; i++) confetti.push({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
    r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 10 + Math.random() * 8,
    color: COLORS[Math.random() * COLORS.length | 0]
  });
}
function frame(time) {
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time / 600 + s.p); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "lighter";
  rockets = rockets.filter(r => {
    r.y += r.vy; ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, 7); ctx.fill();
    if (r.y <= r.ty) { explode(r.x, r.y, r.color); return false; } return true;
  });
  parts = parts.filter(p => {
    p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.05; p.x += p.vx; p.y += p.vy; p.life -= 0.012;
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 7); ctx.fill();
    return p.life > 0;
  });
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  confetti = confetti.filter(c => {
    c.x += c.vx; c.y += c.vy; c.r += c.vr;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.color; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * Math.abs(Math.cos(c.r * 2))); ctx.restore();
    return c.y < H + 30;
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Balloons ---------- */
let balloonTimer;
function addBalloon() {
  const b = document.createElement("div");
  b.className = "balloon";
  const c = COLORS[Math.random() * 6 | 0];
  b.style.background = `radial-gradient(circle at 35% 30%, #fff8 0, ${c} 40%)`;
  b.style.left = (Math.random() * 90) + "vw";
  b.style.setProperty("--drift", ((Math.random() - 0.5) * 200) + "px");
  b.style.animationDuration = (7 + Math.random() * 5) + "s";
  b.addEventListener("pointerdown", e => {
    e.stopPropagation();
    const r = b.getBoundingClientRect(); explode(r.left + r.width / 2, r.top + r.height / 2, c);
    tone(900, audio().currentTime, 0.12, "square", 0.12); b.remove();
  });
  b.addEventListener("animationend", () => b.remove());
  document.body.appendChild(b);
}

/* ---------- Flow ---------- */
let timers = [], celebrating = false;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function startCountdown() {
  audio().resume();
  timers.forEach(clearTimeout); timers = []; clearInterval(balloonTimer);
  document.querySelectorAll(".balloon").forEach(b => b.remove());
  celebrating = false; $("replay").classList.add("hidden");
  show("countdown");
  for (let n = 10; n >= 1; n--) later(() => setNum(n), (10 - n) * 1000);
  later(celebrate, 10000);
}
function setNum(n) {
  const el = $("num"); el.textContent = n; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  el.style.color = n <= 3 ? "var(--pink)" : "";
  beep(n);
}
const SWAP_TIME = 4000; // ms the "I'm two" scene stays up — time to swap candles
function celebrate() {
  // 1) the "1" becomes a lit candle (she's holding the 1 candle)
  show("two");
  const big = $("big2"), words = $("twoWords");
  $("digit").textContent = "1"; big.classList.remove("flip", "is2");
  words.style.visibility = "hidden"; words.classList.remove("msg");
  // 2) flip 1 → 2
  later(() => {
    big.classList.add("flip");
    later(() => { $("digit").textContent = "2"; big.classList.add("is2"); }, 500);
  }, 1500);
  // 3) fireworks + "我两岁了！"
  later(() => {
    beep(0); celebrating = true;
    words.style.visibility = "visible"; words.classList.add("msg");
    for (let i = 0; i < 6; i++) later(() => launch(), i * 220);
    confettiBurst(200);
    (function auto() { if (!celebrating) return; launch(); later(auto, 900 + Math.random() * 1400); })();
  }, 2500);
  // 4) Happy Birthday Maeve
  later(() => {
    show("hb"); playSong(); confettiBurst(250);
    for (let i = 0; i < 5; i++) later(() => launch(), i * 300);
    balloonTimer = setInterval(addBalloon, 900);
    for (let i = 0; i < 6; i++) later(addBalloon, i * 150);
    $("replay").classList.remove("hidden");
  }, 2500 + SWAP_TIME);
}
$("mute").addEventListener("click", e => {
  e.stopPropagation(); muted = !muted;
  $("mute").textContent = muted ? "🔇 静音 · Muted" : "🔊 声音 · Sound on";
  if (!muted) audio().resume();
});

$("startBtn").addEventListener("click", e => {
  e.stopPropagation();
  const d = document.documentElement, fs = d.requestFullscreen || d.webkitRequestFullscreen;
  try { if (fs && !document.fullscreenElement && !document.webkitFullscreenElement) { const p = fs.call(d); if (p && p.catch) p.catch(() => {}); } } catch (err) {}
  startCountdown();
});
$("replay").addEventListener("click", e => { e.stopPropagation(); startCountdown(); });
addEventListener("pointerdown", e => {
  if (!celebrating) return;
  launch(e.clientX, e.clientY);
});
</script>
</body>
</html>
